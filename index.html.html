<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Velez</title>
    <link rel="stylesheet" href="velez.css?v=2">
  </head>
  <body>
    <main class="page">
      <section class="screen screen-cover" id="inicio" aria-label="Portada Velez">
        <img src="Desktopvelez.svg" alt="Portada Velez" class="screen-image">
        <a class="hotspot nav-socio" href="#inicio" aria-label="INICIO"></a>
        <a class="hotspot nav-deportes" href="#deportes" aria-label="DEPORTES"></a>
        <a class="hotspot nav-ubicacion" href="https://www.google.com/maps/place/Estadio+Jos%C3%A9+Amalfitani/@-34.635353,-58.5206891,17z/data=!3m1!4b1!4m6!3m5!1s0x95bcc8382fb08ab9:0xea0ca78972856a8e!8m2!3d-34.635353!4d-58.5206891!16zL20vMDd0Y21r?entry=ttu&g_ep=EgoyMDI2MDYxMy4wIKXMDSoASAFQAw%3D%3D" target="_blank" aria-label="UBICACION"></a>
        <a class="hotspot nav-club" href="#club" aria-label="CLUB"></a>
        <span id="deportes" class="anchor-target anchor-deportes" aria-hidden="true"></span>
      </section>

      <section class="screen" id="por-que-velez" aria-label="Por que Velez">
        <span id="club" class="anchor-target" aria-hidden="true"></span>
        <img src="Desktop.svg" alt="Seccion por que Velez" class="screen-image">
        <a class="hotspot footer-velez" href="https://velez.com.ar/" target="_blank" aria-label="Sitio oficial Velez"></a>
        <a class="hotspot footer-instagram" href="https://www.instagram.com/velez/" target="_blank" aria-label="Instagram"></a>
        <a class="hotspot footer-x" href="https://x.com/Velez" target="_blank" aria-label="X"></a>
      </section>
    </main>
  </body>
</html>
